# Home Assistant connection settings. The SSH host is resolved through the
# matching ~/.ssh/config entry and its included config.d files.
home_assistant:
  url: https://rhys.woohouse.world
  ssh_host: svc-01
  config_dir: /mnt/docker/homeassistant/ha_config

# Every entry in these designer-owned native HA files is imported.
files:
  scenes:
    - scenes/holiday_lighting_designer.yaml
  scripts:
    - scripts/holiday_lighting_designer.yaml
  automations:
    - automations/holiday_lighting_designer.yaml
  helpers:
    - input_select/holiday_lighting_designer.yaml
