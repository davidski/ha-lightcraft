# Home Assistant connection settings. The SSH host is resolved through the
# matching ~/.ssh/config entry and its included config.d files.
home_assistant:
  url: https://rhys.woohouse.world
  ssh_host: svc-01
  config_dir: /mnt/docker/homeassistant/ha_config

# Native HA files containing the configured refs.
files:
  scenes:
    - scenes/exterior_christmas.yaml
    - scenes/exterior_easter.yaml
    - scenes/exterior_halloween.yaml
    - scenes/exterior_memorial_day.yaml
    - scenes/exterior_white.yaml
  scripts:
    - scripts/holiday_lights.yaml
  automations:
    - automations/general_lights.yaml
  helpers:
    - input_select.yaml

# Refs are the only Home Assistant entries imported into local drafts.
refs:
  - scenes:christmas_green
  - scenes:christmas_white
  - scenes:christmas_red
  - scenes:easter_pastel_pink
  - scenes:easter_pastel_yellow
  - scenes:easter_pastel_green
  - scenes:easter_pastel_blue
  - scenes:easter_pastel_purple
  - scenes:halloween_orange
  - scenes:halloween_purple
  - scenes:american_blue
  - scenes:american_red
  - scenes:1666312290455
  - automations:exterior_lights_activate
  - automations:1665867675382
  - helpers:holiday
