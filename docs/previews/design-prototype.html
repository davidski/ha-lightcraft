function catalog(){const names=screen==='sequences'?['Autumn glow','Winter sparkle','Porch welcome','Summer evening']:['Autumn porch','Winter entrance','Weekend welcome'];return `<div class="catalog-head"><h2>${screen==='sequences'?'Sequences':'Schedules'}</h2>${button('New '+(screen==='sequences'?'sequence':'schedule'))}</div><ul class="items">${names.map((n,i)=>`<li><a class="${i===0?'active':''}" aria-disabled="true">${n}<span class="meta">${variant==='current'?(screen==='sequences'?n.toLowerCase().replaceAll(' ','_')+' · 3 steps':'sequence · 10-01 – 11-30 · enabled'):(screen==='sequences'?'3 steps · Loops':'Oct 1 – Nov 30 · Enabled')}</span></a></li>`).join('')}</ul>`}
function preview(){return `<section class="panel sample-preview"><h2>${variant==='studio'?'Preview':'Sequence preview'}</h2><p class="status">${variant==='current'?'Cycles through the defined hold times. Brightness controls the bar intensity.':'Saved sequence · 3 steps · 18 seconds · Loop'}</p><div class="preview-now"><span class="swatch"></span><div><strong>Harvest amber</strong><span class="meta">Step 1 of 3 · 80% brightness${variant==='current'?' · XY (0.557, 0.373)':''}</span></div></div>${variant==='current'?'':`<div class="timeline">${colors.map(c=>`<span style="background:${c[1]}"></span>`).join('')}</div>`}<div class="preview-line"><span>Porch lanterns<span class="meta">light.porch_lanterns</span></span><span class="color-bar"></span><span class="helper">80%</span></div><div class="preview-line"><span>Entry sconce<span class="meta">light.entry_sconce</span></span><span class="color-bar"></span><span class="helper">80%</span></div>${variant==='current'?'':'<p class="helper">Illustration only · not live playback</p>'}</section>`}
function steps(){return colors.map((c,i)=>`<div class="sequence-row"><span class="step-number">0${i+1}</span><label>Catalog color<select>${colors.map((x,j)=>`<option ${j===i?'selected':''}>${x[0]}</option>`).join('')}</select></label><label>Brightness (%)<input type="number" value="${[80,65,55][i]}" min="1" max="100"></label><label>${variant==='current'?'Seconds':'Hold (s)'}<input type="number" value="6"></label><label>${variant==='current'?'Transition':'Fade (s)'}<input type="number" value="0.5"></label><div class="row-tools">${button('↑')}${button('↓')}${button('Remove')}</div></div>`).join('')}
function sequenceEditor(){return `<section class="panel editor"><div class="editor-title"><div><h2>${variant==='current'?'Edit sequence':'Autumn glow'}</h2><span class="helper">Color sequence · Local draft</span></div><span class="helper unpublished">Unpublished changes</span></div><label>Name<input value="Autumn glow"></label><label class="check"><input type="checkbox" checked>Loop sequence</label>${variant==='refined'?`<div class="inline-preview">${preview()}</div>`:''}<h3>Color steps</h3>${steps()}${button('Add color step')}<div class="footer-actions">${button('Update draft','primary')}<span class="helper">${variant==='current'?'':'Saves locally. Publish from Home Assistant.'}</span></div></section>`}
function scheduleEditor(){return `<section class="panel editor"><div class="editor-title"><div><h2>${variant==='current'?'Edit schedule':'Autumn porch'}</h2><span class="helper">Schedule · Local draft</span></div><span class="helper unpublished">Unpublished changes</span></div><label>Schedule title<input value="Autumn porch"></label><div class="form-section"><h3>Program</h3><p class="helper">Choose what plays.</p><label>Program type<select><option>Color sequence for Hue-style lights</option><option>WLED preset or playlist</option></select></label><label>Sequence<select><option>Autumn glow</option><option>Winter sparkle</option></select></label></div><div class="form-section"><h3>Light targets</h3><p class="helper">Groups first. Two targets selected.</p><div class="target-list"><label class="target"><input type="checkbox" checked><span>Porch lanterns <small>light.porch_lanterns · Front porch · Group</small></span></label><label class="target"><input type="checkbox" checked><span>Entry sconce <small>light.entry_sconce · Entrance</small></span></label><label class="target"><input type="checkbox"><span>Garden path <small>light.garden_path · Garden</small></span></label></div></div><div class="form-section"><h3>Timing</h3><p class="helper">Repeats annually. Both dates are included.</p><label class="check"><input type="checkbox">All day (runs continuously during the date range)</label><div class="field-pair"><label>Start date<input value="10-01"></label><label>Start time<input value="sunset"></label><label>End date<input value="11-30"></label><label>Stop time<input value="23:00"></label></div></div><div class="form-section"><h3>Finish behavior</h3><label>When schedule stops<select><option>Turn lights off</option><option>Leave current light state</option></select></label><label class="check"><input type="checkbox" checked>Enabled</label></div><div class="footer-actions">${button('Update draft','primary')}<span class="helper">${variant==='current'?'':'Saves locally. Live schedules remain unchanged.'}</span></div></section>`}
function summary(){return '<div><p class="section-label">At a glance</p><h2>Autumn porch</h2><div class="schedule-summary"><strong>Oct 1 — Nov 30</strong><p>Every year · Dates inclusive</p><strong>Sunset → 23:00</strong><p>Autumn glow · 2 light targets</p><strong>Turn lights off</strong><p>When the schedule ends</p></div><span class="helper">Enabled in draft · Not yet published</span></div>'}
function render(){document.body.className=variant;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.querySelectorAll('.screen-tabs [data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===screen));const edit=screen==='sequences'?sequenceEditor():scheduleEditor();document.getElementById('app').innerHTML=variant==='studio'?`<div class="studio-shell"><aside class="studio-rail">${brand()}<p class="section-label">Workspace</p><nav>${nav()}</nav><p class="rail-status">Local draft<br><span class="unpublished">● Unpublished changes</span></p></aside><div class="studio-content"><div class="studio-top"><div><p class="section-label">Lighting workshop</p><h2>${screen==='sequences'?'Sequences':'Schedules'}</h2><p>${screen==='sequences'?'Compose color, brightness, and rhythm.':'Choose where and when your lighting plays.'}</p></div></div><p class="helper">${descriptions[variant]}</p><div class="studio-layout">${edit}<aside class="studio-context">${screen==='sequences'?preview():summary()}<section class="catalog">${catalog()}</section></aside></div></div></div>`:`<header>${brand()}<nav>${nav()}</nav></header><div class="comparison-caption">${descriptions[variant]}</div><main>${variant==='current'&&screen==='sequences'?preview():''}<div class="grid"><aside class="panel catalog">${catalog()}</aside>${edit}</div></main>`;const url=new URL(location);url.searchParams.set('variant',variant);url.searchParams.set('screen',screen);history.replaceState(null,'',url);}
document.addEventListener('click',e=>{const v=e.target.closest('[data-variant]'),s=e.target.closest('[data-screen]');if(v){variant=v.dataset.variant;render()}else if(s){e.preventDefault();screen=s.dataset.screen;render()}else if(e.target.closest('a[aria-disabled]'))e.preventDefault()});
function cycle(delta){variant=variants[(variants.indexOf(variant)+delta+variants.length)%variants.length];render()}
document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script></html>
