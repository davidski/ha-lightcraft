services:
  ha-lightcraft:
    image: ghcr.io/davidski/ha-lightcraft:latest
    ports:
      - "${HA_LIGHTCRAFT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    environment:
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL:-}
      HOMEASSISTANT_TOKEN: ${HOMEASSISTANT_TOKEN:-}
      HOMEASSISTANT_SSH_HOST: ${HOMEASSISTANT_SSH_HOST:-}
      HOMEASSISTANT_SSH_USER: ${HOMEASSISTANT_SSH_USER:-}
      HOMEASSISTANT_SSH_KEY: /run/secrets/ha-lightcraft-key
      HOMEASSISTANT_CONFIG_DIR: ${HOMEASSISTANT_CONFIG_DIR:-}
      HOMEASSISTANT_PACKAGE: ${HOMEASSISTANT_PACKAGE:-}
      HOMEASSISTANT_LEGACY_SCENES_FILE: ${HOMEASSISTANT_LEGACY_SCENES_FILE:-}
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./data:/data/data
      - ./backups:/data/backups
    secrets:
      - ha-lightcraft-key
    restart: unless-stopped

secrets:
  ha-lightcraft-key:
    file: "${HOMEASSISTANT_SSH_KEY:?Set HOMEASSISTANT_SSH_KEY in .env}"
